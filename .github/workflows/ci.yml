# The checks a change has to pass to reach main, run here rather than on the Mac that made it:
# agents land dozens of changes a day from one busy Mac, where the same checks took from five
# minutes to forty and queued one behind another. scripts/land.sh pushes a branch, opens its pull
# request and puts it in main's merge queue; the queue runs this on the change as it would land
# (on top of main and of what's queued before it) and merges it when `gate` passes, so main never
# holds a commit these didn't see. docs/development.md, *Keeping main working*, has the whole of it.
#
# Which checks a change calls for is one table, scripts/land.sh `calls_for`, asked here as
# `--plan`: the docs alone call for none, the windows' code for the UI's, the engine's for both.
# `gate` is the one check main's rules require: it passes when every check that was called for
# passed, and so also when none was. The browser checks aren't among them: they take ninety
# minutes of a runner, and run on main after what lands (checks.yml, which says why).
#
#   pull_request   a pull request's own run: everything it calls for, for whoever reviews
#                  it. Not one scripts/land.sh opened, which says so in its description: from
#                  a branch of this repository and into main, it leaves the checks to the
#                  queue's run rather than run everything twice, so its `gate` passes with
#                  nothing run, and the script queues it. That's only so while main has a
#                  merge queue, which is asked each time. `scripts/land.sh --check` runs a
#                  branch's checks without a pull request.
#   merge_group    the queue's run: everything the group's changes call for.
#   push to main   a commit that reached main some other way (a release's version commit, an
#                  admin's push): everything it calls for, each push by itself. The queue's
#                  own pushes ran already, as its merge_group run.
#   schedule       once a day on main, everything: a toolchain or a runner's image that moved.
#   workflow_dispatch  everything, on any pushed branch: `gh workflow run ci.yml --ref <branch>`
#                  (scripts/land.sh --check does it and waits).
#
# The public repository's minutes on GitHub's own runners are free, macOS's too.
name: CI

# A pull request's run is named for it. Nothing else GitHub says of a run tells which pull
# request it was for (two of one branch, into different branches, have the same commit and
# branch), and scripts/land.sh finds the one it waits on by this. Any other run keeps the name
# GitHub gives it.
run-name: "${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}"

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request pushed to again has no use for the run on what it was. Every other run is of
  # a commit that's on main or about to be, and a push's has a group of its own: of several
  # waiting in one group GitHub keeps only the last, and each push is checked for what it
  # brought.
  group: ci-${{ github.event_name }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'one' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.plan.outputs.ui }}
      engine: ${{ steps.plan.outputs.engine }}
      said: ${{ steps.plan.outputs.said }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        # bash as GitHub runs it when it's named: a planner that fails fails this step, where
        # the default would take the last command of its pipe, which is tr, for how it went.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          # What the change is against: a pull request's base, the queue's main, the commit a
          # push moved main from.
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          LANDING: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.body, 'scripts/land.sh queues this for main') && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          all="ui engine"
          said=""
          # A pull request scripts/land.sh opened (its description says so), into main from
          # one of this repository's own branches, can only merge through main's merge queue,
          # whose run checks it: asked for, since without the queue nothing else would.
          queue=""
          if [ "$LANDING" = true ]; then
            queue="$(gh api graphql -F owner="$OWNER" -F name="$NAME" -f query='query($owner: String!, $name: String!) { repository(owner: $owner, name: $name) { mergeQueue(branch: "main") { id } } }' --jq '.data.repository.mergeQueue.id // empty' || true)"
          fi
          if [ -n "$queue" ]; then
            said="A landing's pull request: nothing is checked here, and main's merge queue checks it before it merges."
            words=""
          elif [ "$EVENT" = push ] && [ "$ACTOR" = "github-merge-queue[bot]" ]; then
            said="The merge queue's own push: its run checked this commit before it merged."
            words=""
          elif [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            words="$all"
          elif [ -z "$BASE" ] || ! git fetch -q --no-tags --depth=1 origin "$BASE"; then
            echo "Nothing to compare with: everything."
            words="$all"
          else
            git diff --no-renames --name-only -z "$BASE" HEAD > "$RUNNER_TEMP/changed"
            tr '\0' '\n' < "$RUNNER_TEMP/changed" | sed 's/^/  /'
            # With no path, --plan would ask about a branch this checkout hasn't got.
            # And with many, xargs asks in several goes, a line of words each.
            words=""
            if [ -s "$RUNNER_TEMP/changed" ]; then
              words="$(xargs -0 scripts/land.sh --plan < "$RUNNER_TEMP/changed" | tr '\n' ' ')"
            fi
            [ -n "$words" ] || said="Nothing this changes is checked: docs and notes."
          fi
          echo "${said:-Calls for: $words}"
          echo "said=$said" >> "$GITHUB_OUTPUT"
          for word in $all; do
            case " $words " in
              *" $word "*) echo "$word=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "$word=false" >> "$GITHUB_OUTPUT" ;;
            esac
          done

  # The windows: the typecheck and the bundle, the linter, the unit tests.
  ui:
    name: ui
    needs: plan
    if: needs.plan.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # The engine on Linux, which no Mac can build (GTK's system libraries are Linux's): it catches
  # code only macOS uses, a test that needed a harness's command line, a default that's macOS's.
  linux:
    name: engine (Linux)
    needs: plan
    if: needs.plan.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Outside the checkout, as every checkout's builds are on a Mac (.cargo/config.toml).
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: What Tauri builds on, and what the tests run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config tmux zsh
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Tauri's build embeds the bundle.
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      # Ghostty's terminal library (libghostty-vt) builds from Ghostty's source with Zig, the
      # version the pinned Ghostty asks for (docs/development.md).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../../target"
          # Main's runs write the cache; a change's run reads it.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # The engine on macOS, where most of what it does is: the same macOS as the app is built on.
  macos:
    name: engine (macOS)
    needs: plan
    if: needs.plan.outputs.engine == 'true'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: What the tests run
        run: brew install tmux
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../../target"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  # The one check main's rules name. It passes when the plan was made and every check it
  # called for passed: one that was called for and didn't run is as much a failure as one that
  # ran and failed.
  gate:
    name: gate
    needs: [plan, ui, linux, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          SAID: ${{ needs.plan.outputs.said }}
          UI: ${{ needs.plan.outputs.ui }} ${{ needs.ui.result }}
          ENGINE_LINUX: ${{ needs.plan.outputs.engine }} ${{ needs.linux.result }}
          ENGINE_MACOS: ${{ needs.plan.outputs.engine }} ${{ needs.macos.result }}
        run: |
          [ -z "$SAID" ] || echo "$SAID"
          went=0
          [ "$PLAN" = success ] || { echo "The plan wasn't made ($PLAN), so there's no telling what should have run."; went=1; }
          held() {
            case "$2" in
              "true success" | "false skipped") echo "$1: ${2#* }" ;;
              true\ *) echo "$1 was called for and didn't pass: ${2#* }."; went=1 ;;
              *) echo "$1 wasn't called for, and yet: ${2#* }."; went=1 ;;
            esac
          }
          held "ui" "$UI"
          held "engine (Linux)" "$ENGINE_LINUX"
          held "engine (macOS)" "$ENGINE_MACOS"
          exit "$went"
