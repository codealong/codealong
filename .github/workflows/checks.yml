# The browser checks that hold on a made-up Mac (scripts/checks.sh --fixture: the runs listed in
# scripts/preview/fixture-passes.txt, in headless Chrome over the engine's debug build), run on
# main after what lands there rather than before it.
#
# Not in the merge queue's run (ci.yml), though they're as much a check as the others: on
# GitHub's macOS runners the list takes about ninety minutes of one machine, and the plan runs
# five macOS machines at once for the whole repository. Run for every landing they would hold
# each one up for longer than the busy Mac did, and the queue behind it. Here one run goes at
# a time and, while it does, only one of the runs waiting stays (GitHub keeps the last to
# arrive, which needn't be the latest push's). So a run on main checks main as it is when the
# run starts, not the commit that started it (unless this file has changed between the two,
# when it checks its own): however fast changes land, each run covers everything landed by
# then, and a failure names the stretch since the last run that passed.
# GitHub lists a run under the commit that started it, so each says which commit it checked
# in an artifact's name (`tested-<commit>`), which is what the next run's plan and a release
# go by. A red run is somebody's (scripts/watch-main.sh, docs/development.md, *Keeping main
# working*).
#
# To have them on a branch before it lands: `gh workflow run checks.yml --ref <branch>`. A pull
# request that changes this file runs them too, to see they still run.
name: Browser checks

on:
  push:
    branches: [main]
  pull_request:
    paths: [".github/workflows/checks.yml"]
  schedule:
    - cron: "53 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never

jobs:
  # Whether anything landed since the last run that passed calls for them (scripts/land.sh
  # `calls_for`: the windows' code, the engine's, the checks themselves). Asked of that whole
  # stretch and not of this push alone: a push of notes can be the one whose run stays, with a
  # change to the windows landed just before it.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Main as it is now, for a run on main; the commit asked for otherwise.
          ref: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && 'main' || '' }}
      - id: plan
        # bash as GitHub runs it when it's named: a planner that fails fails this step, where
        # the default would take the last command of its pipe, which is tr, for how it went.
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub runs this file as the commit that started the run has it, which on a busy
          # main can be older than main's by now. A run vouches only for commits whose copy of
          # this file is the one it runs (an older one would pass main for jobs it doesn't
          # have): where main's has changed since, it checks its own commit, and main is the
          # next run's, or the day's.
          if [ "$EVENT" = push ] || [ "$EVENT" = schedule ]; then
            git fetch -q --no-tags --depth=1 origin "$GITHUB_SHA"
            if ! git diff --quiet "$GITHUB_SHA" HEAD -- .github/workflows/checks.yml; then
              echo "This file has changed on main since $GITHUB_SHA, which this run is of: checking that commit."
              git checkout -q --detach "$GITHUB_SHA"
            fi
          fi
          # Every job after this checks this commit, whatever lands while they run.
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Checking $(git rev-parse HEAD)."
          mkdir -p "$RUNNER_TEMP/tested"
          git rev-parse HEAD > "$RUNNER_TEMP/tested/commit"
          checks=true
          if [ "$EVENT" = push ]; then
            # The last run on main that passed, and the commit it says it checked. Main's own:
            # a list by branch also has a fork's pull request from a branch it calls main,
            # which runs the fork's copy of this file and says what it likes.
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/checks.yml/runs?branch=main&status=success&per_page=30" --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and (.event == \"push\" or .event == \"schedule\" or .event == \"workflow_dispatch\"))][0].id // empty" || true)"
            passed=""
            if [ -n "$run" ]; then
              passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" --jq '[.artifacts[].name | select(startswith("tested-"))][0] // empty' || true)"
              passed="${passed#tested-}"
            fi
            if [ -n "$passed" ] && git fetch -q --no-tags --depth=1 origin "$passed"; then
              git diff --no-renames --name-only -z "$passed" HEAD > "$RUNNER_TEMP/changed"
              echo "Since the last run that passed ($passed):"
              tr '\0' '\n' < "$RUNNER_TEMP/changed" | sed 's/^/  /'
              words=""
              if [ -s "$RUNNER_TEMP/changed" ]; then
                words="$(xargs -0 scripts/land.sh --plan < "$RUNNER_TEMP/changed" | tr '\n' ' ')"
              fi
              case " $words " in *" checks "*) ;; *) checks=false ;; esac
            fi
          fi
          echo "The browser checks: $checks"
          echo "checks=$checks" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: tested-${{ steps.plan.outputs.commit }}
          path: ${{ runner.temp }}/tested/commit
          retention-days: 30

  # The engine the checks run: a debug build, made once for all their sets and kept for as long
  # as src-tauri is what it was built from (scripts/engine.sh goes by the same) and how it's
  # built hasn't changed, so a change to the windows alone builds nothing.
  engine:
    name: the checks' engine
    needs: plan
    if: needs.plan.outputs.checks == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/../target
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - id: built-from
        run: echo "tree=$(git rev-parse HEAD:src-tauri)" >> "$GITHUB_OUTPUT"
      - id: kept
        uses: actions/cache@v6
        with:
          path: .preview/engine
          key: checks-engine-${{ runner.os }}-${{ runner.arch }}-${{ steps.built-from.outputs.tree }}-${{ hashFiles('.cargo/**', 'scripts/engine.sh', 'scripts/target-dir.sh') }}
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - if: steps.kept.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../../target"
          # A debug build of the app, not the tests': a cache of its own, which main's runs
          # write.
          key: checks
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: scripts/engine.sh
        run: scripts/engine.sh
      - uses: actions/upload-artifact@v7
        with:
          name: checks-engine
          path: .preview/engine/codealong
          retention-days: 1

  # The list's checks dealt into four sets, a runner each.
  checks:
    name: browser checks
    needs: [plan, engine]
    if: needs.plan.outputs.checks == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        set: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: checks-engine
          path: .preview/engine
      - name: scripts/checks.sh --fixture, this set's checks
        env:
          SET: ${{ matrix.set }}
        run: |
          chmod +x .preview/engine/codealong
          names="$(sed -n 's#.*scripts/preview/\(.*\)-check\.js.*#\1#p' scripts/preview/fixture-passes.txt | sort -u | awk -v set="$SET" 'NR % 4 == set % 4')"
          echo "This set: $(echo $names)"
          # shellcheck disable=SC2086
          PREVIEW_BIN="$PWD/.preview/engine/codealong" scripts/checks.sh --fixture --listed --jobs=3 $names
