[package]
name = "codealong"
version = "0.1.0"
description = "Every agent runs in a worktree, and every worktree is a lane."
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

# The engine, and codealong-peer (peer/): the part of it other devices' apps build on.
[workspace]
members = [".", "peer"]
default-members = [".", "peer"]

[lib]
name = "codealong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memchr = "2"
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
notify = "8"
ignore = "0.4"
dirs = "6"
anyhow = "1"
libc = "0.2"
urlencoding = "2"
sha2 = "0.10"
toml_edit = "0.23"
# OpenCode and Antigravity keep their sessions in SQLite databases.
rusqlite = { version = "0.37", features = ["bundled"] }
# The `codealong` command (cli.rs): its --help is the reference the agent skill points at.
clap = { version = "4", features = ["derive", "wrap_help"] }
# The quick panel's shortcut, which works in every app (Carbon hot keys: no permission needed).
tauri-plugin-global-shortcut = "2"
# Automatic updates (updates.rs). 2.12 is the newest that runs on Tauri 2.11: 2.13 needs 2.12,
# which Cargo would otherwise upgrade Tauri to without asking.
tauri-plugin-updater = "~2.12"
# Your other devices (peers.rs): what goes between them, iroh included, is codealong-peer; the
# engine keeps device keys with iroh's types, and data-encoding writes them.
codealong-peer = { path = "peer" }
iroh = "1"
data-encoding = "2"
# Link codes as QR codes, for the phone app to scan (Settings › Devices).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The floating bar, the quick panel and the focus outline (flash.rs): panels, window occlusion, placement and Spaces, which
# Tauri doesn't expose; and the sounds for what comes to wait on you (sounds.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSBox", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSSound", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSGeometry", "NSNotification", "NSProcessInfo", "NSString"] }

# updates.rs's end-to-end test runs the updater in Tauri's mock runtime, which opens no window.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Keep file/line backtraces without full variable/type debug information, so
# development and test builds use less disk space across worktrees.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Built for rebuild speed, not the last few percent of engine speed: no LTO (thin LTO relinks
# the whole crate for a one-line change), incremental on, default codegen units.
[profile.release]
lto = false
incremental = true
strip = true
