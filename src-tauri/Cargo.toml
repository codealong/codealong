[package]
name = "codealong"
version = "0.1.0"
description = "Every agent runs in a worktree, and every worktree is a lane."
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "codealong_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
notify = "8"
ignore = "0.4"
dirs = "6"
anyhow = "1"
libc = "0.2"
urlencoding = "2"
sha2 = "0.10"
toml_edit = "0.23"
# OpenCode and Antigravity keep their sessions in SQLite databases.
rusqlite = { version = "0.37", features = ["bundled"] }

# The floating bar: window occlusion, placement and Spaces, which Tauri doesn't expose.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGraphics", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }

# Built for rebuild speed, not the last few percent of engine speed: no LTO (thin LTO relinks
# the whole crate for a one-line change), incremental on, default codegen units.
[profile.release]
lto = false
incremental = true
strip = true
