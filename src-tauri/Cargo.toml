[package]
name = "codealong"
version = "0.1.0"
description = "Every agent runs in a worktree, and every worktree is a lane."
edition = "2021"
license = "Apache-2.0"
rust-version = "1.80"
publish = false

# The engine, and codealong-peer (peer/): the part of it other devices' apps build on.
[workspace]
members = [".", "peer"]
default-members = [".", "peer"]

[lib]
name = "codealong_lib"
# Only the engine binary links the library. Tauri's template also makes a static and a dynamic
# library for its mobile targets, which Codealong doesn't have: every build of the library wrote a
# 600 MB archive nothing read.
crate-type = ["rlib"]
# The crate has no doc tests, and looking for them made rustdoc expand the whole crate on every
# cargo test.
doctest = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
memchr = "2"
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
toml = "1"
notify = "8"
ignore = "0.4"
dirs = "6"
anyhow = "1"
libc = "0.2"
urlencoding = "2"
sha2 = "0.10"
toml_edit = "0.23"
# OpenCode and Antigravity keep their sessions in SQLite databases.
rusqlite = { version = "0.37", features = ["bundled"] }
# The `codealong` command (cli.rs): its --help is the reference the agent skill points at.
clap = { version = "4", features = ["derive", "wrap_help"] }
# The quick panel's shortcut, which works in every app (Carbon hot keys: no permission needed).
tauri-plugin-global-shortcut = "2"
# Automatic updates (updates.rs). 2.12 is the newest that runs on Tauri 2.11: 2.13 needs 2.12,
# which Cargo would otherwise upgrade Tauri to without asking.
tauri-plugin-updater = "~2.12"
# Your other devices (peers.rs): what goes between them, iroh included, is codealong-peer; the
# engine keeps device keys with iroh's types, and data-encoding writes them.
codealong-peer = { path = "peer" }
iroh = "1"
data-encoding = "2"
# Link codes as QR codes, for the phone app to scan (Settings › Devices).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# The floating bar, the quick panel and the focus outline (flash.rs): panels, window occlusion, placement and Spaces, which
# Tauri doesn't expose; and the sounds for what comes to wait on you (sounds.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSBitmapImageRep", "NSBox", "NSColor", "NSEvent", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPanel", "NSResponder", "NSRunningApplication", "NSScreen", "NSSound", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSProcessInfo", "NSString"] }
# Improve Codealong's pictures of the windows (improve.rs): WKWebView draws its own page, so no screen-recording permission is asked.
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }
block2 = "0.6"

# updates.rs's end-to-end test runs the updater in Tauri's mock runtime, which opens no window.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

# No debug information in development and test builds (the test profile inherits this one): a
# panic still names its file and line. On macOS line tables stay in each build's object files,
# which cargo leaves in the shared build directory: 300,000 of them, 72 GB, before this.
# Dependencies are optimized. They compile once for every worktree, and the debug engine the
# browser checks snapshot with (scripts/engine.sh) spends its time in them reading a board.
[profile.dev]
debug = false

[profile.dev.package."*"]
opt-level = 2

# Built for rebuild speed, not the last few percent of engine speed: no LTO (thin LTO relinks
# the whole crate for a one-line change), incremental on, default codegen units.
[profile.release]
lto = false
incremental = true
strip = true
